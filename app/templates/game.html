<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Первопроходец Сибири</title>
    <script src="/static/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121212;
            --bg-panel: #1a1a1a;
            --text: #e0dcd3;
            --text-dim: #8a8a8a;
            --border: #333333;
            --danger: #8b0000;
            --good: #4a7a3a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px; line-height: 1.5; color-scheme: dark;
        }
        body { display: flex; flex-direction: column;
               min-height: 100vh; min-height: 100dvh; }

        /* ============ СТАТУС-БАР ============ */
        #stats-bar {
            flex: 0 0 auto; padding: 4px 6px;
            background: var(--bg-panel); border-bottom: 1px solid var(--border);
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
        }
        #stats-bar .stat {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 3px 1px; background: #0e0e0e; border: 1px solid #222;
            font-weight: 500; color: var(--text);
            text-align: center; line-height: 1.05; min-height: 36px;
        }
        #stats-bar .stat.critical {
            color: var(--danger); border-color: var(--danger);
            animation: pulse-danger 1.6s ease-in-out infinite;
        }
        @keyframes pulse-danger {
            0%,100% { background: #0e0e0e; }
            50% { background: #1f0505; }
        }
        #stats-bar .stat .label {
            font-size: 8px; color: var(--text-dim); text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        #stats-bar .stat .value { font-size: 13px; font-weight: 600; }

        /* ============ КОНТЕНТ ============ */
        #content {
            flex: 1 1 auto; overflow-y: auto; padding: 14px 12px;
            max-width: 720px; width: 100%; margin: 0 auto;
            -webkit-overflow-scrolling: touch;
        }
        #title {
            font-size: 17px; font-weight: 700; margin: 0 0 10px 0;
            letter-spacing: 0.02em;
        }
        #title:empty { display: none; }
        #text {
            font-size: 15.5px; white-space: pre-wrap;
            word-wrap: break-word; line-height: 1.55;
        }
        #text.typing::after {
            content: '▌'; color: var(--danger);
            animation: blink 0.8s step-end infinite; font-weight: 100;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .game-over { color: var(--danger); font-weight: 700;
                     font-size: 20px; margin-bottom: 14px;
                     letter-spacing: 0.04em; }
        .victory { color: var(--text); font-weight: 700;
                   font-size: 20px; margin-bottom: 14px;
                   letter-spacing: 0.04em; }
        .advisor {
            margin-top: 14px; padding: 10px 12px;
            border-left: 2px solid #555; background: #181818;
            font-size: 14px; color: #bdb8ad; font-style: italic;
        }
        .achievement {
            margin-top: 8px; padding: 8px 10px;
            border-left: 2px solid var(--good); background: #14200f;
            font-size: 14px; color: #c8dcc0;
        }
        .vignette {
            margin-top: 18px;
            display: flex;
            justify-content: center;
        }
        .vignette-img {
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid #333;
        }

        /* ============ КНОПКИ ============ */
        #actions {
            flex: 0 0 auto;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0));
            background: var(--bg-panel); border-top: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 5px;
            max-width: 720px; width: 100%; margin: 0 auto;
        }
        #actions.grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        #actions.grid button.wide { grid-column: span 2; }

        button {
            padding: 10px 8px; background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 13.5px; cursor: pointer; text-align: center;
            transition: none; user-select: none; -webkit-user-select: none;
            min-height: 42px; display: flex; align-items: center;
            justify-content: center; line-height: 1.25; white-space: normal;
        }
        button:active:not(:disabled) {
            background: var(--text); color: var(--bg);
            border-color: var(--text);
        }
        button:disabled, button.locked {
            opacity: 0.35; cursor: not-allowed;
            color: var(--text-dim); border-color: #222;
        }
        button.locked::before { content: "🔒 "; margin-right: 4px; opacity: 0.7; }
        button.danger { border-color: var(--danger); color: var(--danger); }
        button.danger:active:not(:disabled) {
            background: var(--danger); color: var(--text);
            border-color: var(--danger);
        }
        button.primary { border-color: #666; color: #fff; }
        button.primary:active:not(:disabled) {
            background: var(--text); color: var(--bg);
            border-color: var(--text);
        }
        .btn-icon {
            width: 20px;
            height: 20px;
            margin-right: 6px;
            vertical-align: middle;
            object-fit: contain;
            display: inline-block;
            flex-shrink: 0;
        }

        /* ============ ЛОГИН ============ */
        #login-screen {
            flex: 1; padding: 40px 24px; max-width: 420px;
            margin: 0 auto; width: 100%;
            display: flex; flex-direction: column; justify-content: center;
        }
        #login-screen h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px 0; }
        #login-screen p { color: var(--text-dim);
                          font-family: -apple-system, sans-serif;
                          font-size: 14px; margin: 0 0 24px 0; }
        #login-screen input {
            width: 100%; padding: 12px 14px; background: var(--bg-panel);
            border: 1px solid var(--border); color: var(--text);
            font-family: -apple-system, sans-serif; font-size: 16px;
            margin-bottom: 14px; border-radius: 0;
        }
        #login-screen input:focus { outline: none; border-color: var(--text); }

        #content::-webkit-scrollbar { width: 4px; }
        #content::-webkit-scrollbar-track { background: transparent; }
        #content::-webkit-scrollbar-thumb { background: #2a2a2a; }
    </style>
</head>
<body>

<div id="login-screen" style="display: none;">
    <h1>Первопроходец Сибири</h1>
    <p>Введи Telegram ID:</p>
    <input type="number" id="tg-input" placeholder="123456789" value="123123123">
    <button onclick="login()">Войти</button>
</div>

<div id="game-screen" style="display: none; flex: 1; flex-direction: column; min-height: 0;">
    <div id="stats-bar">
        <div class="stat" id="stat-year"><div class="label">Год</div><div class="value">1</div></div>
        <div class="stat" id="stat-season"><div class="label">Сезон</div><div class="value">Осень</div></div>
        <div class="stat" id="stat-distance"><div class="label">Вёрсты</div><div class="value">0</div></div>
        <div class="stat" id="stat-flour"><div class="label">Мука</div><div class="value">0</div></div>
        <div class="stat" id="stat-fish"><div class="label">Рыба</div><div class="value">0</div></div>
        <div class="stat" id="stat-meat"><div class="label">Мясо</div><div class="value">0</div></div>
        <div class="stat" id="stat-berries"><div class="label">Ягоды</div><div class="value">0</div></div>
        <div class="stat" id="stat-vit-c"><div class="label">Витамин</div><div class="value">100</div></div>
        <div class="stat" id="stat-morale"><div class="label">Мораль</div><div class="value">100</div></div>
        <div class="stat" id="stat-discipline"><div class="label">Дисципл.</div><div class="value">70</div></div>
        <div class="stat" id="stat-squad"><div class="label">Отряд</div><div class="value">7/0</div></div>
        <div class="stat" id="stat-money"><div class="label">Рублей</div><div class="value">0</div></div>
        <div class="stat" id="stat-charters"><div class="label">Грамот</div><div class="value">0</div></div>
        <div class="stat" id="stat-cities"><div class="label">Городов</div><div class="value">0</div></div>
    </div>
    <div id="content"><div id="title"></div><div id="text"></div></div>
    <div id="actions"></div>
</div>

<script>
// ============================================================
// TELEGRAM
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    if (tg.BackButton) tg.BackButton.hide();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

function haptic(type) {
    if (!tg?.HapticFeedback) return;
    try {
        if (type === 'error' || type === 'success')
            tg.HapticFeedback.notificationOccurred(type);
        else
            tg.HapticFeedback.impactOccurred(type);
    } catch (e) {}
}

function getTelegramId() {
    const id = tg?.initDataUnsafe?.user?.id;
    if (id) return id;
    const saved = localStorage.getItem('tg_id');
    return saved ? parseInt(saved, 10) : null;
}
function getTelegramUsername() {
    return tg?.initDataUnsafe?.user?.username || null;
}

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let TG_ID = null;
let typewriterTimer = null;
let currentRun = null;

// ============================================================
// API
// ============================================================
async function api(path, payload = {}) {
    const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: TG_ID, ...payload }),
    });
    return { status: res.status, body: await res.json() };
}

// ============================================================
// ПЕЧАТНАЯ МАШИНКА
// ============================================================
// Ключевые сюжетные ивенты — печатаются медленно.
// Остальные — мгновенно.
const KEY_EVENTS = new Set([
    "event_first_rumor",
    "event_second_rumor",
    "event_chuvash_mys",
    "event_fortify_isker",
    "event_tsar_gift",
    "event_old_kazak_warning",
    "event_siege_start",
    "event_siege_hunger",
    "event_siege_assault",
    "event_siege_koltso",
    "event_siege_end",
    "event_cannibal_last_chance",
    "event_cannibal_rumors",
    "event_scurvy_start",
    "event_scurvy_treatment",
    "event_arrow_wound",
    "event_gangrene_wound",
    "event_bear_den",
    "event_bear_den_round2",
    "event_polar_bear",
    "event_hypervitaminosis",
    "event_vagai_night",
    "event_vagai_night_armor",
    "event_vagai_drowning",
    "event_mangazeya_land",
]);

function typeWriter(el, text, speed = 22) {
    cancelTypewriter();
    el.textContent = '';
    el.classList.add('typing');
    let i = 0;
    typewriterTimer = setInterval(() => {
        if (i % 6 === 0) haptic('light');
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
            clearInterval(typewriterTimer);
            typewriterTimer = null;
            el.classList.remove('typing');
        }
    }, speed);
}

function cancelTypewriter() {
    if (typewriterTimer) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
    }
    const el = document.getElementById('text');
    if (el) el.classList.remove('typing');
}

// ============================================================
// UI
// ============================================================
function setStat(id, value, critical) {
    const el = document.getElementById(id);
    if (!el) return;
    const v = el.querySelector('.value');
    if (!v) return;
    v.textContent = value;
    if (critical) el.classList.add('critical');
    else el.classList.remove('critical');
}

function setStats(run) {
    if (!run) return;
    currentRun = run;
    setStat('stat-year', run.year, false);
    setStat('stat-season', run.season_name || '?', false);
    setStat('stat-distance', run.distance_covered, false);
    setStat('stat-flour', run.flour, run.flour < 40);
    setStat('stat-fish', run.fish, false);
    setStat('stat-meat', run.meat, false);
    setStat('stat-berries', run.cranberries, false);
    setStat('stat-vit-c', run.vit_c, run.vit_c < 30 || run.scurvy_active);
    setStat('stat-morale', run.morale, run.morale < 20);
    setStat('stat-discipline', run.discipline, run.discipline < 30);
    setStat('stat-squad', `${run.squad_size}/${run.wounded}`, run.squad_size < 3);
    setStat('stat-money', run.money, false);
    setStat('stat-charters', run.charters, false);
    setStat('stat-cities', run.cities_count, false);
}

function setContent(title, text, instant = false) {
    document.getElementById('title').textContent = title || '';
    const textEl = document.getElementById('text');
    if (!text) {
        textEl.textContent = '';
        cancelTypewriter();
    } else if (instant) {
        cancelTypewriter();
        textEl.textContent = text;
    } else {
        typeWriter(textEl, text);
    }
    document.getElementById('content').scrollTop = 0;
}

function setHtml(title, html) {
    cancelTypewriter();
    document.getElementById('title').textContent = title || '';
    document.getElementById('text').innerHTML = html;
    document.getElementById('content').scrollTop = 0;
}

function clearActions() {
    const el = document.getElementById('actions');
    el.innerHTML = '';
    el.classList.remove('grid');
}

function setActionsGrid(on) {
    const el = document.getElementById('actions');
    if (on) el.classList.add('grid');
    else el.classList.remove('grid');
}

function addButton(text, onclick, options = {}) {
    const btn = document.createElement('button');

    if (options.icon) {
        const img = document.createElement('img');
        img.src = options.icon;
        img.className = 'btn-icon';
        img.alt = '';
        img.onerror = () => { img.style.display = 'none'; };
        btn.appendChild(img);
    }

    const span = document.createElement('span');
    span.textContent = text;
    btn.appendChild(span);

    if (options.danger) btn.classList.add('danger');
    if (options.primary) btn.classList.add('primary');
    if (options.wide) btn.classList.add('wide');
    if (options.locked) {
        btn.classList.add('locked');
        btn.disabled = true;
        btn.title = options.lockReason || 'Недоступно';
    } else {
        btn.onclick = () => {
            haptic('medium');
            onclick();
        };
    }
    document.getElementById('actions').appendChild(btn);
}

function showScreen(name) {
    const login = document.getElementById('login-screen');
    const game = document.getElementById('game-screen');
    if (name === 'login') {
        login.style.display = 'flex';
        game.style.display = 'none';
    } else {
        login.style.display = 'none';
        game.style.display = 'flex';
    }
}

// ============================================================
// ОТРЯД
// ============================================================
function renderTravelersList(run) {
    const list = (run.travelers || []).filter(t => t.alive);
    if (!list.length) return '<div>Все погибли.</div>';
    let html = '<div style="font-size:15px; line-height:1.9;">';
    list.forEach(t => {
        let status = '';
        const parts = [];

        if (t.wound_level === 1) parts.push('гематома');
        else if (t.wound_level === 2) parts.push('рваная рана');
        else if (t.wound_level === 3) parts.push('тяжёлая рана');

        if (t.infection) parts.push('<span style="color:#8b0000;">инфекция</span>');
        if (t.gangrene) parts.push('<span style="color:#8b0000;">гангрена</span>');
        if (t.arrow_stuck) parts.push('стрела в теле');
        if (t.scurvy) parts.push('<span style="color:#8b0000;">цинга</span>');
        if (t.lead_poisoning_days > 0) parts.push('свинцовое отравление');

        if (t.is_caretaker) parts.push(`<span style="color:#8a8a8a;">при раненым (${t.caring_for})</span>`);

        if (parts.length) {
            status = parts.join(', ');
        } else {
            status = `силы ${t.endurance}/${t.endurance_max}`;
        }

        if (t.scar) status += ' <span style="color:#8a8a8a;">(шрам)</span>';

        let role = '';
        if (t.is_ataman) role = '⚔ ';
        else if (t.is_priest) role = '✝ ';
        else if (t.is_doctor) role = '✚ ';

        html += `${role}<b>${t.name}</b> — ${status}<br>`;
    });
    html += '</div>';
    return html;
}

// ============================================================
// МЕНЮ ДЕЙСТВИЙ
// ============================================================
function addMainMenu() {
    setActionsGrid(true);

    const run = currentRun;
    const isWinter = run && run.is_winter;
    const day = run ? run.day : 1;
    const fur = run?.inventory?.fur || 0;
    const wounded = run?.wounded || 0;
    const scurvy = run?.scurvy_active;
    const vitC = run?.vit_c || 100;
    const morale = run?.morale || 100;

    // Главная кнопка
    if (isWinter) {
        addButton('Переждать день', onNextTurn, { primary: true, wide: true });
    } else {
        addButton('Идти дальше', onNextTurn, { primary: true, wide: true });
    }

    // Праздновать Рождество — строго 3-й день зимы, раз в год
    if (isWinter && run && run.season_day === 3) {
        const celebratedYears = run.christmas_years || [];
        const notYet = !celebratedYears.includes(run.year);
        const hasPriest = (run.travelers || []).some(
            t => t.alive && t.is_priest
        );
        if (notYet && hasPriest) {
            addButton('✨ Праздновать Рождество',
                      () => onDoAction('christmas'),
                      { wide: true });
        }
    }

    // Праздновать Пасху — строго 4-й день весны, раз в год
    if (run && run.season === 0 && run.season_day === 4) {
        const celebratedYears = run.easter_years || [];
        const notYet = !celebratedYears.includes(run.year);
        const hasPriest = (run.travelers || []).some(
            t => t.alive && t.is_priest
        );
        if (notYet && hasPriest) {
            addButton('Праздновать Пасху',
                      () => onDoAction('easter'),
                      { wide: true,
                        icon: '/static/img/red_egg.png' });
        }
    }

    // Добыча — только не зимой и не в первые дни
    if (!isWinter && day >= 3) {
        addButton('Охотиться', () => onDoAction('hunt'));

        if (run && (run.season === 0 || run.season === 1
                    || run.season === 2)) {
            addButton('Наловить рыбы', () => onDoAction('fish'));
        }

        if (run && (run.season === 1 || run.season === 2)) {
            addButton('Собрать ягоды', () => onDoAction('berries'));
        }

        addButton('Заготовить дрова', () => onDoAction('wood'));

        if (run && run.season !== 3) {
            addButton('Собрать травы', () => onDoAction('herbs'));
        }
    }

    // Отвар — если витамин низкий или цинга
    if (scurvy || vitC < 60) {
        addButton('Сварить отвар', () => onDoAction('pine'));
    }

    // Отдых — если есть раненые или мораль просела
    if (wounded > 0 || morale < 50) {
        addButton('Отдохнуть у костра', () => onDoAction('rest'));
    }

    // Панцирь Ермака
    if (run && run.ermak_has_armor) {
        const armorText = run.ermak_wearing_armor
            ? 'Снять панцирь'
            : 'Надеть панцирь';
        addButton(armorText, () => onDoAction('toggle_armor'));
    }

    // Продажа пушнины — только если есть
    if (fur > 0) {
        addButton('Продать пушнину', () => onDoAction('sell_fur'));
    }

    // Отправка в Москву — если есть 100+ пушнины
    if (fur >= 100) {
        addButton('Отправить в Москву', () => onDoAction('send_to_tsar'));
    }

    // Основание города — только если хватает грамот
    const charters = run?.charters || 0;
    const citiesCount = run?.cities_count || 0;
    const cityCost = 5 + 5 * citiesCount;
    if (charters >= cityCost) {
        addButton('Основать город', () => onDoAction('found_city'),
                  { wide: true });
    }

    addButton('Показать отряд', onShowTravelers, { wide: true });
}

// ============================================================
// BOOT
// ============================================================
async function boot() {
    TG_ID = getTelegramId();
    if (!TG_ID) { showScreen('login'); return; }
    localStorage.setItem('tg_id', TG_ID);
    showScreen('game');

    const { body: state } = await api('/api/get_state');

    if (state.status === 'no_user' || state.status === 'no_run') {
        await startNewGame();
    } else if (state.status === 'ok') {
        setStats(state.run);
        if (state.run.current_event_id) {
            await loadCurrentEvent();
        } else if ((state.run.tags || []).includes('game_won')) {
            await showEpilogue();
        } else {
            showIdle(state.run);
        }
    }
}

async function login() {
    const id = parseInt(document.getElementById('tg-input').value, 10);
    if (!id || isNaN(id)) { haptic('error'); return; }
    TG_ID = id;
    localStorage.setItem('tg_id', TG_ID);
    await boot();
}

async function startNewGame() {
    const { body } = await api('/api/start_game',
        { username: getTelegramUsername() });
    if (body.status === 'created' || body.status === 'already_running') {
        setStats(body.run);
        showIdle(body.run);
    } else {
        setContent('Ошибка', JSON.stringify(body), true);
    }
}

// ============================================================
// IDLE
// ============================================================
function showIdle(run) {
    const isFirst = run && run.day === 1 && run.distance_covered === 0;
    if (isFirst) {
        setContent('Экспедиция',
            'Вы вышли из Нижнего Чусовского Городка. Строгановы дали вам лодки, соль и хлеб. Позади Кама, впереди Камень. Пора идти за Урал.');
    } else {
        setContent('', 'Что делаем сегодня?', true);
    }
    clearActions();
    addMainMenu();
}

// ============================================================
// ХОД
// ============================================================
async function onNextTurn() {
    haptic('light');
    clearActions();
    setContent('', '...', true);

    const { body } = await api('/api/next_turn');

    if (body.status === 'game_over') {
        haptic('error');
        setStats({ day: body.day, year: 0, season_name: '',
            distance_covered: body.distance_covered,
            flour: 0, fish: 0, meat: 0, cranberries: 0, vit_c: 0,
            morale: 0, discipline: 0, squad_size: 0, wounded: 0,
            money: 0, charters: 0, cities_count: 0 });
        setHtml('Конец пути',
            `<div class="game-over">☠ ${body.reason}</div>` +
            `Вы прошли ${body.distance_covered} вёрст и погибли на ${body.day}-й день.`);
        clearActions();
        addButton('Начать заново', onRestart, { danger: true });
        return;
    }
    if (body.status === 'victory') {
        haptic('success');
        setStats(body.run || currentRun);
        await showEpilogue();
        return;
    }

    setStats(body.run);
    renderAchievements(body.achievements);

    if (body.type === 'event') {
        haptic('medium');
        renderEvent(body.event_id, body.event_title, body.event_text,
            body.choices, body.run, body.advisor_hint);
    } else if (body.type === 'quiet_day') {
        let text = body.message || 'Тихий день.';
        if (body.deltas?.length)
            text += '\n\n' + body.deltas.map(d => '• ' + d).join('\n');
        setContent('', text, true);
        if (body.advisor_hint) appendAdvisor(body.advisor_hint);
        clearActions();
        addMainMenu();
    } else {
        setContent('', 'Тихий день. Ничего не произошло.', true);
        clearActions();
        addMainMenu();
    }
}

// ============================================================
// ИВЕНТ
// ============================================================
function renderEvent(eventId, title, text, choices, run, advisorHint) {
    const instant = !KEY_EVENTS.has(eventId);
    setContent(title, text, instant);
    if (advisorHint) appendAdvisor(advisorHint);
    clearActions();

    choices.forEach(ch => {
        const cond = ch.conditions || {};

        for (const tag of cond.tags_forbidden || []) {
            if ((run.tags || []).includes(tag)) return;
        }
        for (const [item, qty] of Object.entries(cond.items_required || {})) {
            if ((run.inventory?.[item] || 0) < qty) return;
        }
        for (const tag of cond.tags_required || []) {
            if (!(run.tags || []).includes(tag)) return;
        }
        if (cond.season_in && !cond.season_in.includes(run.season)) return;

        addButton(ch.text, () => onMakeChoice(eventId, ch.choice_id));
    });
}

// ============================================================
// ВЫБОР
// ============================================================
async function onMakeChoice(eventId, choiceId) {
    clearActions();
    setContent('', '...', true);

    const { body } = await api('/api/make_choice',
        { event_id: eventId, choice_id: choiceId });

    if (body.status === 'error') {
        haptic('error');
        setContent('Ошибка', body.message, true);
        clearActions();
        addMainMenu();
        return;
    }

    setStats(body.run);
    haptic('success');

    let text = '';
    if (body.consequences) {
        if (body.consequences.narrative)
            text += body.consequences.narrative;
        if (body.consequences.deltas?.length) {
            if (text) text += '\n\n';
            text += body.consequences.deltas.map(d => '• ' + d).join('\n');
        }
    }
    setContent('', text || 'Выбор сделан.', true);

    if (body.next_event) {
        const { body: state } = await api('/api/get_state');
        const { body: ev } = await api('/api/get_event',
            { event_id: state.run.current_event_id });
        if (ev.status === 'ok') {
            let fullText = text
                ? text + '\n\n———\n\n' + ev.event_text
                : ev.event_text;
            const instant = !KEY_EVENTS.has(ev.event_id);
            setContent(ev.event_title, fullText, instant);
            clearActions();
            ev.choices.forEach(ch => {
                const cond = ch.conditions || {};

                for (const tag of cond.tags_forbidden || []) {
                    if ((state.run.tags || []).includes(tag)) return;
                }
                for (const [item, qty] of Object.entries(cond.items_required || {})) {
                    if ((state.run.inventory?.[item] || 0) < qty) return;
                }
                for (const tag of cond.tags_required || []) {
                    if (!(state.run.tags || []).includes(tag)) return;
                }
                if (cond.season_in && !cond.season_in.includes(state.run.season)) return;

                addButton(ch.text,
                    () => onMakeChoice(ev.event_id, ch.choice_id));
            });
            return;
        }
    }

    clearActions();
    addMainMenu();
}

// ============================================================
// ДЕЙСТВИЕ
// ============================================================
async function onDoAction(actionType) {
    clearActions();
    setContent('', '...', true);

    const { body } = await api('/api/do_action',
        { action_type: actionType });

    if (body.status === 'game_over') {
        haptic('error');
        setStats({ day: body.day, year: 0, season_name: '',
            distance_covered: body.distance_covered,
            flour: 0, fish: 0, meat: 0, cranberries: 0, vit_c: 0,
            morale: 0, discipline: 0, squad_size: 0, wounded: 0,
            money: 0, charters: 0, cities_count: 0 });
        setHtml('Конец пути',
            `<div class="game-over">☠ ${body.reason}</div>` +
            `Вы прошли ${body.distance_covered} вёрст и погибли на ${body.day}-й день.`);
        clearActions();
        addButton('Начать заново', onRestart, { danger: true });
        return;
    }
    if (body.status === 'error') {
        setContent('Ошибка', body.message, true);
        showIdle(currentRun);
        return;
    }

    setStats(body.run);
    haptic('success');

    let text = body.narrative || '';
    if (body.deltas?.length)
        text += '\n\n' + body.deltas.map(d => '• ' + d).join('\n');
    setContent('', text, true);
    if (body.vignette) appendVignette(body.vignette);
    if (body.advisor_hint) appendAdvisor(body.advisor_hint);
    renderAchievements(body.achievements);

    // Если открылся chain-ивент (крещение после Пасхи)
    if (body.run && body.run.current_event_id) {
        await loadCurrentEvent();
        return;
    }

    clearActions();
    addMainMenu();
}

// ============================================================
// ОТРЯД
// ============================================================
function onShowTravelers() {
    if (!currentRun) return;
    const html = renderTravelersList(currentRun);
    setHtml('Отряд', html);
    clearActions();
    addButton('Назад', () => {
        if (currentRun.current_event_id) {
            loadCurrentEvent();
        } else {
            showIdle(currentRun);
        }
    });
}

// ============================================================
// ЗАГРУЗКА ИВЕНТА
// ============================================================
async function loadCurrentEvent() {
    const { body: state } = await api('/api/get_state');
    if (state.status !== 'ok' || !state.run.current_event_id) {
        showIdle(state.run);
        return;
    }
    setStats(state.run);
    const { body: ev } = await api('/api/get_event',
        { event_id: state.run.current_event_id });
    if (ev.status !== 'ok') {
        setContent('Ошибка', ev.message || JSON.stringify(ev), true);
        clearActions();
        addMainMenu();
        return;
    }
    renderEvent(ev.event_id, ev.event_title, ev.event_text,
        ev.choices, state.run);
}

// ============================================================
// ЭПИЛОГ
// ============================================================
async function showEpilogue() {
    const { body } = await api('/api/epilogue');
    if (body.status !== 'ok') {
        setHtml('Земля мангазейская',
            `<div class="victory">✦ ЗЕМЛЯ МАНГАЗЕЙСКАЯ ✦</div>Вы дошли.`);
        clearActions();
        addButton('Начать заново', onRestart, { danger: true });
        return;
    }

    const e = body.epilogue;
    let html = `<div class="victory">✦ ${e.headline} ✦</div>`;
    html += '<div style="font-size:16px; line-height:1.8;">';
    e.lines.forEach(line => { html += '• ' + line + '<br>'; });
    html += '</div>';
    if (e.final) {
        html += `<div style="margin-top:18px; padding-top:14px; border-top:1px solid #333; font-style:italic; color:#b8b3a8;">${e.final}</div>`;
    }
    setHtml('', html);
    clearActions();
    addButton('Начать заново', onRestart, { danger: true });
}

// ============================================================
// ВИНЬЕТКА (картинка)
// ============================================================
function appendVignette(type) {
    let src = null;
    let alt = '';
    if (type === 'christmas') {
        src = '/static/img/christmas.png';
        alt = 'Рождество';
    } else if (type === 'easter') {
        src = '/static/img/easter.png';
        alt = 'Пасха';
    }
    if (!src) return;

    const textEl = document.getElementById('text');
    const div = document.createElement('div');
    div.className = 'vignette';
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt;
    img.className = 'vignette-img';
    img.onerror = () => { div.style.display = 'none'; };
    div.appendChild(img);
    textEl.appendChild(div);
}

// ============================================================
// СОВЕТНИК
// ============================================================
function appendAdvisor(hint) {
    const textEl = document.getElementById('text');
    const div = document.createElement('div');
    div.className = 'advisor';
    div.textContent = hint;
    textEl.appendChild(div);
}

// ============================================================
// ДОСТИЖЕНИЯ
// ============================================================
function renderAchievements(achievements) {
    if (!achievements?.length) return;
    const textEl = document.getElementById('text');
    achievements.forEach(a => {
        const div = document.createElement('div');
        div.className = 'achievement';
        div.textContent = '🏆 ' + a;
        textEl.appendChild(div);
    });
}

// ============================================================
// РЕСТАРТ
// ============================================================
async function onRestart() {
    await startNewGame();
}

// ============================================================
// СТАРТ
// ============================================================
document.getElementById('content').addEventListener('click', cancelTypewriter);
window.addEventListener('DOMContentLoaded', boot);
</script>
